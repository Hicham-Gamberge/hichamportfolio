<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Installation d'une machine virtuelle</title><desc id="desc">Machine virtuelle dans un environnement de test.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1b38"/><stop offset="1" stop-color="#243313"/></linearGradient></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect x="155" y="145" width="690" height="390" rx="22" fill="#070b1e" stroke="#00d9ff" stroke-width="5"/><rect x="205" y="195" width="590" height="275" rx="10" fill="#111f3d"/><circle cx="245" cy="230" r="10" fill="#28c840"/><text x="245" y="315" fill="#00d9ff" font-family="monospace" font-size="31">user@virtual-machine:~$</text><text x="245" y="370" fill="#cbd5e1" font-family="monospace" font-size="29">sudo apt install openssh</text><text x="245" y="425" fill="#94a3b8" font-family="monospace" font-size="26">system ready / isolated</text><path d="M500 535v55M380 590h240" stroke="#00d9ff" stroke-width="15" stroke-linecap="round"/><rect x="900" y="240" width="150" height="230" rx="16" fill="#172347" stroke="#d946ef" stroke-width="5"/><rect x="930" y="275" width="90" height="120" rx="8" fill="#00d9ff" opacity=".8"/><circle cx="975" cy="430" r="14" fill="#28c840"/><text x="105" y="680" fill="#f1f5f9" font-family="sans-serif" font-size="44" font-weight="700">VIRTUAL MACHINE</text></svg>